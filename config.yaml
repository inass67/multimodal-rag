domain_name: "agent_recherche_documentaire"

paths:
  raw_pdf_dir: "data/raw"
  processed_dir: "data/processed"
  images_dir: "data/processed/images"
  index_dir: "index"

chunking:
  chunk_size: 220
  chunk_overlap: 40

embeddings:
  text_model: "intfloat/multilingual-e5-small"
  clip_model: "clip-ViT-B-32"

retrieval:
  top_k_text: 5
  top_k_images: 4
  alpha: 0.5
  min_image_score: 0.30

llm:
  provider: "gemini"
  model: "gemini-3.5-flash-lite"
  fallback_models: ["gemini-3.1-flash-lite", "gemini-3.6-flash"]
  thinking: ""
  api_key_env: "GOOGLE_API_KEY"
  temperature: 0.2

agent:
  planner: "rules"
  max_retries: 1

summary:
  max_words_per_batch: 2500
  max_batches: 6

evaluation:
  max_answer_questions: 10
  support_threshold: 0.5
  llm_judge: false
  embedding_models:
    - "sentence-transformers/all-MiniLM-L6-v2"
    - "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    - "intfloat/multilingual-e5-small"